version: 2

models:
  - name: dim_accounts
    description: "Dimensional account model built from Salesforce account staging data."
    columns:
      - name: account_id
        description: "Unique Salesforce account identifier."
        tests:
          - not_null
          - unique
      - name: created_date
        description: "Account creation timestamp cast to timestamp."
        tests:
          - not_null
      - name: last_modified_date
        description: "Last modified timestamp cast to timestamp."
      - name: system_modstamp
        description: "System modification timestamp cast to timestamp."
      - name: account_sk
        description: "Surrogate key for the account dimension generated using dbt_utils.generate_surrogate_key on account_id and tick."
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - account_id
                  - ticker_symbol
      - name: account_number
        description: "Account number from Salesforce account staging data."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^[A-Z]{2}[0-9]{6}(-[A-Z])?$'"
  - name: dim_campaign
    description: "Dimensional campaign model built from Salesforce campaign staging data."
    columns:
      - name: campaign_id
        description: "Unique Salesforce campaign identifier."
        tests:
          - not_null
          - unique
      - name: created_date
        description: "Campaign creation timestamp cast to timestamp."
        tests:
          - not_null
      - name: last_modified_date
        description: "Last modified timestamp cast to timestamp."
      - name: system_modstamp
        description: "System modification timestamp cast to timestamp."
  - name: fct_opportunity
    description: "Fact opportunity model built from Salesforce opportunity staging data."
    columns:
      - name: opportunity_id
        description: "Unique Salesforce opportunity identifier."
        tests:
          - not_null
          - unique   
      - name: created_date
        description: "Opportunity creation timestamp cast to timestamp."
        tests:
          - not_null
      - name: last_modified_date
        description: "Last modified timestamp cast to timestamp."
      - name: system_modstamp
        description: "System modification timestamp cast to timestamp."
      - name: account_sk
        description: "Foreign key to dim_accounts.account_skl."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_sk
      - name: contact_sk
        description: "Foreign key to dim_contacts.contact_id."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contacts')
                field: contact_sk
  - name: fct_case
    description: "Fact case model built from Salesforce case staging data."
    columns:
      - name: case_id
        description: "Unique Salesforce case identifier."
        tests:
          - not_null
          - unique
      - name: created_date
        description: "Case creation timestamp cast to timestamp."
        tests:
          - not_null
      - name: last_modified_date
        description: "Last modified timestamp cast to timestamp."
      - name: system_modstamp
        description: "System modification timestamp cast to timestamp."
      - name: pricebook_entry_sk
        description: "Foreign key to dim_pricebook_entry.pricebook_entry_sk for product pricing information."
        tests:
          - relationships:
              arguments:
                to: ref('dim_pricebook_entry')
                field: pricebook_entry_sk
      - name: pricebook_entry_id
        description: "Unique Salesforce pricebook entry identifier."
        tests:
          - relationships:
              arguments:
                to: ref('dim_pricebook_entry')
                field: pricebook_entry_id
  - name: fct_lead
    description: "Fact lead model built from Salesforce lead staging data."
    columns:
      - name: lead_id
        description: "Unique Salesforce lead identifier."
        tests:
          - not_null
          - unique
      - name: created_date
        description: "Lead creation timestamp cast to timestamp."
        tests:
          - not_null
      - name: last_modified_date
        description: "Last modified timestamp cast to timestamp."
      - name: system_modstamp
        description: "System modification timestamp cast to timestamp."
      - name: converted_account_id
        description: "Foreign key to dim_accounts.account_id for converted leads."
        tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_sk
      - name: converted_contact_id
        description: "Foreign key to dim_contacts.contact_id for converted leads."
        tests:
          - relationships:
              arguments:
                to: ref('dim_contacts')
                field: contact_sk
      - name: converted_opportunity_id
        description: "Foreign key to fct_opportunity.opportunity_id for converted leads."
        tests:
          - relationships:
              arguments:
                to: ref('fct_opportunity')
                field: opportunity_id
  - name: fct_case_history
    description: "Fact case history model built from Salesforce case history staging data."
    columns:
      - name: case_history_id
        description: "Unique identifier for each case history record."
        tests:
          - not_null
          - unique
      - name: case_id
        description: "Foreign key to fct_case.case_id."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_case')
                field: case_id
      - name: last_modified_date
        description: "Last modified timestamp cast to timestamp."
      - name: system_modstamp
        description: "System modification timestamp cast to timestamp."
  - name: dim_pricebook_entry
    description: "Dimensional pricebook entry model tracking product pricing by pricebook."
    columns:
      - name: pricebook_entry_id
        description: "Unique Salesforce pricebook entry identifier."
        tests:
          - not_null
          - unique
      - name: pricebook_entry_sk
        description: "Surrogate key for the pricebook entry dimension."
        tests:
          - not_null
          - unique
      - name: product_id
        description: "Foreign key to dim_products.product_id."
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: pricebook_id
        description: "Unique Salesforce pricebook identifier."
        tests:
          - not_null
      - name: unit_price
        description: "Price per unit of the product in the pricebook."
        tests:
          - not_null
      - name: is_active
        description: "Flag indicating if the pricebook entry is active."
        tests:
          - not_null
      - name: created_date
        description: "Pricebook entry creation timestamp."
        tests:
          - not_null
      - name: is_current
        description: "Flag indicating if this is the current version of the pricebook entry."
        tests:
          - not_null